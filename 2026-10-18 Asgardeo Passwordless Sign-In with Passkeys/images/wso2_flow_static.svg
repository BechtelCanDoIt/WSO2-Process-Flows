<text x="200.0" y="352" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">React App</text>
<rect x="350" y="312" width="240" height="64" rx="12" fill="#1C1C1F" stroke="#3A3A40" stroke-width="1.5"/>
<text x="470.0" y="352" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">Next.js App</text>
