<text x="1375" y="370" font-size="26" font-weight="700" fill="#000" text-anchor="middle">WSO2 Asgardeo</text>
<path d="M450.0,597.5 L499.3333333333333,597.5" stroke="#FF7A1A" stroke-width="3" fill="none" marker-end="url(#ar)"/>
