<rect x="80.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">01</text>
<rect x="341.5" y="500" width="80.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="381.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Embed Sign-In</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">Drop the SignIn component into</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">the app with the npm SDK.</text>
<rect x="503.3333333333333" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="775.3333333333333" y="500" width="70.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="810.3333333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">AUTH</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Start Auth Flow</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">Redirect or in-app flow opens</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">against the Asgardeo tenant.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1156.6666666666665" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1212.6666666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">IDENTITY</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Identify the User</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Look up the account by username</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">or email, no password asked.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1580.0" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1636.0" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">SECURITY</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Offer Passkey</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">Prompt for biometric or device</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">passkey via the browser.</text>
<rect x="80.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="352.0" y="830" width="70.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="387.0" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">AUTH</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Verify Assertion</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Check the signed WebAuthn</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">challenge against the stored</text>
<text x="108.0" y="1016" font-size="21" fill="#D4D4DA">key.</text>
<rect x="503.3333333333333" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="858" font-size="40" font-weight="800" fill="#FF7A1A">06</text>
<rect x="701.8333333333333" y="830" width="143.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="773.5833333333333" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">ORCHESTRATE</text>
<text x="531.3333333333333" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Fall Back to OTP</text>
<text x="531.3333333333333" y="958" font-size="21" fill="#D4D4DA">Send an email or SMS OTP or</text>
<text x="531.3333333333333" y="987" font-size="21" fill="#D4D4DA">magic link if no passkey</text>
<text x="531.3333333333333" y="1016" font-size="21" fill="#D4D4DA">exists.</text>
<rect x="926.6666666666666" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="858" font-size="40" font-weight="800" fill="#FF7A1A">07</text>
<rect x="1156.6666666666665" y="830" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1212.6666666666665" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">SECURITY</text>
<text x="954.6666666666666" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Step Up on Risk</text>
<text x="954.6666666666666" y="958" font-size="21" fill="#D4D4DA">Adaptive rules add MFA when the</text>
<text x="954.6666666666666" y="987" font-size="21" fill="#D4D4DA">sign-in looks unusual.</text>
<rect x="1350.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">08</text>
<rect x="1601.0" y="830" width="91.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1646.5" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OUTPUT</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Issue Tokens</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Return ID and access tokens and</text>
<text x="1378.0" y="987" font-size="21" fill="#D4D4DA">start the session.</text>
