<rect width="1800" height="1165" fill="#000"/><rect width="1800" height="1165" fill="url(#g)"/>
<text x="80" y="95" font-size="22" font-weight="700" letter-spacing="5" fill="#FF7A1A">WSO2 AI GATEWAY</text>
<text x="80" y="160" font-size="52" font-weight="700" fill="#FFFFFF">Multi-Provider LLM Failover and Load Balancing</text>
<text x="80" y="204" font-size="24" fill="#A8A8B0">Keep agents answering when a model provider goes down.</text>
<rect x="80" y="226" width="120" height="4" rx="2" fill="#FF7A1A"/>
<text x="80" y="292" font-size="16" font-weight="700" letter-spacing="3" fill="#A8A8B0">CALLERS</text>
