<rect x="80.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">01</text>
<rect x="341.5" y="500" width="80.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="381.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Commit Triggers Build</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">A push to the repo starts an</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">auto-generated CI pipeline.</text>
<rect x="503.3333333333333" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="733.3333333333333" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="789.3333333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">SECURITY</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Build and Scan</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">Build the image once, then scan</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">it and sign off before any</text>
<text x="531.3333333333333" y="686" font-size="21" fill="#D4D4DA">deploy.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1177.6666666666665" y="500" width="91.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1223.1666666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">DEPLOY</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Deploy to Dev</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Argo CD syncs the build to the</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">dev cluster, no hand-run</text>
<text x="954.6666666666666" y="686" font-size="21" fill="#D4D4DA">kubectl.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1569.5" y="500" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1630.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">TRANSFORM</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Inject Config</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">Secrets and config bind per</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">environment, never baked into</text>
<text x="1378.0" y="686" font-size="21" fill="#D4D4DA">the image.</text>
<rect x="80.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="352.0" y="830" width="70.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="387.0" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">AUTH</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Check Policy Gate</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Compliance and resource rules</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">must pass before the next</text>
<text x="108.0" y="1016" font-size="21" fill="#D4D4DA">promotion.</text>
<rect x="503.3333333333333" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="858" font-size="40" font-weight="800" fill="#FF7A1A">06</text>
<rect x="701.8333333333333" y="830" width="143.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="773.5833333333333" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">ORCHESTRATE</text>
<text x="531.3333333333333" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Promote Same Build</text>
<text x="531.3333333333333" y="958" font-size="21" fill="#D4D4DA">The identical artifact moves to</text>
<text x="531.3333333333333" y="987" font-size="21" fill="#D4D4DA">staging and prod on AWS, Azure</text>
<text x="531.3333333333333" y="1016" font-size="21" fill="#D4D4DA">or GCP.</text>
<rect x="926.6666666666666" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="858" font-size="40" font-weight="800" fill="#FF7A1A">07</text>
<rect x="1167.1666666666665" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1217.9166666666665" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">GATEWAY</text>
<text x="954.6666666666666" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Enforce Zero Trust</text>
<text x="954.6666666666666" y="958" font-size="21" fill="#D4D4DA">Service-to-service calls are</text>
<text x="954.6666666666666" y="987" font-size="21" fill="#D4D4DA">verified in every environment.</text>
<rect x="1350.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">08</text>
<rect x="1590.5" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1641.25" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Watch and Alert</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Central logs and metrics flag</text>
<text x="1378.0" y="987" font-size="21" fill="#D4D4DA">drift and failed rollouts.</text>
<line x1="80" y1="1091" x2="1720" y2="1091" stroke="#2A2A2E"/>
<text x="80" y="1127" font-size="17" fill="#A8A8B0">GitOps  ·  Build Once, Promote Many  ·  Policy as Code  ·  Zero Trust Security</text>
<text x="1720" y="1127" font-size="17" fill="#A8A8B0" text-anchor="end">wso2.com/choreo  ·  Scott Bechtel</text>
</svg>