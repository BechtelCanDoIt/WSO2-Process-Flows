<text x="80" y="95" font-size="22" font-weight="700" letter-spacing="5" fill="#FF7A1A">WSO2 CHOREO</text>
<text x="80" y="160" font-size="52" font-weight="700" fill="#FFFFFF">GitOps Promotion Across Clouds</text>
<text x="80" y="204" font-size="24" fill="#A8A8B0">Promote one build through every environment with policy gates.</text>
<rect x="80" y="226" width="120" height="4" rx="2" fill="#FF7A1A"/>
<text x="80" y="292" font-size="16" font-weight="700" letter-spacing="3" fill="#A8A8B0">TRIGGERS</text>
