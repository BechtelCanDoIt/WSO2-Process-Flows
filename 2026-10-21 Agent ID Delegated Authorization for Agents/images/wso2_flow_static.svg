<rect x="80.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">01</text>
<rect x="341.5" y="500" width="80.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="381.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">User Asks Agent</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">A user hands a task to an agent</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">in an app.</text>
<rect x="503.3333333333333" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="775.3333333333333" y="500" width="70.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="810.3333333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">AUTH</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Agent Authenticates</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">The agent proves its own</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">identity with mTLS or Private</text>
<text x="531.3333333333333" y="686" font-size="21" fill="#D4D4DA">Key JWT.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1156.6666666666665" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1212.6666666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">IDENTITY</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Load Agent Metadata</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Owner, purpose and risk level</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">come from the agent identity</text>
<text x="954.6666666666666" y="686" font-size="21" fill="#D4D4DA">record.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1580.0" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1636.0" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">SECURITY</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Request User Consent</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">The user approves the scopes</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">this agent may use on their</text>
<text x="1378.0" y="686" font-size="21" fill="#D4D4DA">behalf.</text>
<rect x="80.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="278.5" y="830" width="143.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="350.25" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">ORCHESTRATE</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Evaluate Policy</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Policy weighs consent, risk</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">level and the requested scope.</text>
<rect x="503.3333333333333" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="858" font-size="40" font-weight="800" fill="#FF7A1A">06</text>
<rect x="775.3333333333333" y="830" width="70.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="810.3333333333333" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">AUTH</text>
<text x="531.3333333333333" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Issue Delegated Token</text>
<text x="531.3333333333333" y="958" font-size="21" fill="#D4D4DA">The token records that the</text>
<text x="531.3333333333333" y="987" font-size="21" fill="#D4D4DA">agent acts for the user.</text>
<rect x="926.6666666666666" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="858" font-size="40" font-weight="800" fill="#FF7A1A">07</text>
<rect x="1167.1666666666665" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1217.9166666666665" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">GATEWAY</text>
<text x="954.6666666666666" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Call Tool or API</text>
<text x="954.6666666666666" y="958" font-size="21" fill="#D4D4DA">The MCP server or API checks</text>
<text x="954.6666666666666" y="987" font-size="21" fill="#D4D4DA">delegation and scope.</text>
<rect x="1350.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">08</text>
<rect x="1590.5" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1641.25" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Log Separate Trail</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Agent actions land in an audit</text>
<text x="1378.0" y="987" font-size="21" fill="#D4D4DA">trail apart from human logs.</text>
<line x1="80" y1="1091" x2="1720" y2="1091" stroke="#2A2A2E"/>
<text x="80" y="1127" font-size="17" fill="#A8A8B0">Delegated Authorization  ·  Human-in-the-Loop Consent  ·  Least Privilege</text>
<text x="1720" y="1127" font-size="17" fill="#A8A8B0" text-anchor="end">wso2.com/identity-platform/agent-id  ·  Scott Bechtel</text>
