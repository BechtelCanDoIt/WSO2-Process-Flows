<rect x="80.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">01</text>
<rect x="341.5" y="500" width="80.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="381.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Client Calls API</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">Apps and developers call</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">managed APIs through the</text>
<text x="108.0" y="686" font-size="21" fill="#D4D4DA">gateway.</text>
<rect x="503.3333333333333" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="743.8333333333333" y="500" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="794.5833333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">GATEWAY</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Gateway Starts Trace</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">The gateway opens a span and</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">stamps a trace ID on the call.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1146.1666666666665" y="500" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1207.4166666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">TRANSFORM</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Propagate Trace IDs</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Trace headers follow the</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">request into every backend</text>
<text x="954.6666666666666" y="686" font-size="21" fill="#D4D4DA">service.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1569.5" y="500" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1630.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INTEGRATE</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Backends Emit Spans</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">Services report their own spans</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">using OpenTelemetry.</text>
<rect x="80.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="320.5" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="371.25" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Capture API Events</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Traffic, latency and errors</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">flow into Moesif-powered</text>
<text x="108.0" y="1016" font-size="21" fill="#D4D4DA">analytics.</text>
<rect x="503.3333333333333" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="858" font-size="40" font-weight="800" fill="#FF7A1A">06</text>
<rect x="722.8333333333333" y="830" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="784.0833333333333" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">TRANSFORM</text>
<text x="531.3333333333333" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Join Traces to Usage</text>
<text x="531.3333333333333" y="958" font-size="21" fill="#D4D4DA">Link each trace to the</text>
<text x="531.3333333333333" y="987" font-size="21" fill="#D4D4DA">application and developer</text>
<text x="531.3333333333333" y="1016" font-size="21" fill="#D4D4DA">behind it.</text>
<rect x="926.6666666666666" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="858" font-size="40" font-weight="800" fill="#FF7A1A">07</text>
<rect x="1167.1666666666665" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1217.9166666666665" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="954.6666666666666" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Pinpoint the Slow Hop</text>
<text x="954.6666666666666" y="958" font-size="21" fill="#D4D4DA">Drill from an error spike down</text>
<text x="954.6666666666666" y="987" font-size="21" fill="#D4D4DA">to the span that caused it.</text>
<rect x="1350.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">08</text>
<rect x="1601.0" y="830" width="91.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1646.5" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OUTPUT</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Alert the Owner</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Send anomalies to Slack or</text>
<text x="1378.0" y="987" font-size="21" fill="#D4D4DA">PagerDuty with a trace link.</text>
