<text x="80" y="95" font-size="22" font-weight="700" letter-spacing="5" fill="#FF7A1A">WSO2 APIM ANALYTICS</text>
<text x="80" y="160" font-size="52" font-weight="700" fill="#FFFFFF">OpenTelemetry Tracing Across APIs and Backends</text>
<text x="80" y="204" font-size="24" fill="#A8A8B0">Find the slow hop behind an API error spike in minutes.</text>
