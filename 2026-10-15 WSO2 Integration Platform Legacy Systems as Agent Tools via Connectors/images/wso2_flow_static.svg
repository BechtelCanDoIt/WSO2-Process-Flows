<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1165" viewBox="0 0 1800 1165" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#FF7A1A"/></marker><radialGradient id="g" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#FF7A1A" stop-opacity="0.14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
<rect width="1800" height="1165" fill="#000"/><rect width="1800" height="1165" fill="url(#g)"/>
<text x="80" y="95" font-size="22" font-weight="700" letter-spacing="5" fill="#FF7A1A">WSO2 INTEGRATION PLATFORM</text>
<text x="80" y="160" font-size="52" font-weight="700" fill="#FFFFFF">Legacy Systems as Agent Tools via Connectors</text>
<text x="80" y="204" font-size="24" fill="#A8A8B0">Let agents act on SOAP, database and ERP systems without rewrites.</text>
<rect x="80" y="226" width="120" height="4" rx="2" fill="#FF7A1A"/>
<text x="80" y="292" font-size="16" font-weight="700" letter-spacing="3" fill="#A8A8B0">TRIGGERS</text>
<rect x="80" y="312" width="240" height="64" rx="12" fill="#1C1C1F" stroke="#3A3A40" stroke-width="1.5"/>
<text x="200.0" y="352" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">API Call</text>
