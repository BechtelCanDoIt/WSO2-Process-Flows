<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="320.5" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="371.25" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Detect Deviations</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Error spikes and latency drift</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">stand out against the baseline.</text>
