<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="722.8333333333333" y="500" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="784.0833333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INTEGRATE</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Stream to Analytics</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">Events flow to the analytics</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">backend in near real time, per</text>
<text x="531.3333333333333" y="686" font-size="21" fill="#D4D4DA">gateway.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1146.1666666666665" y="500" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1207.4166666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">TRANSFORM</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Aggregate Metrics</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Traffic, error rate, and</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">latency roll up per API, app,</text>
<text x="954.6666666666666" y="686" font-size="21" fill="#D4D4DA">and region.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1590.5" y="500" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1641.25" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Set Baselines</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">Normal volume and latency are</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">tracked per API across time</text>
<text x="1378.0" y="686" font-size="21" fill="#D4D4DA">windows.</text>
