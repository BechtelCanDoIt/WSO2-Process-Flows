<text x="954.6666666666666" y="858" font-size="40" font-weight="800" fill="#FF7A1A">07</text>
<rect x="1167.1666666666665" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1217.9166666666665" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="954.6666666666666" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Drill to Root Cause</text>
<text x="954.6666666666666" y="958" font-size="21" fill="#D4D4DA">Dashboards narrow the issue to</text>
<text x="954.6666666666666" y="987" font-size="21" fill="#D4D4DA">one backend, consumer, or</text>
<text x="954.6666666666666" y="1016" font-size="21" fill="#D4D4DA">release.</text>
