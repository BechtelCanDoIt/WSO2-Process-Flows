<text x="1378.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">08</text>
<rect x="1601.0" y="830" width="91.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1646.5" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OUTPUT</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Act and Verify</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Throttle, roll back, or fix the</text>
<text x="1378.0" y="987" font-size="21" fill="#D4D4DA">backend, then confirm metrics</text>
<text x="1378.0" y="1016" font-size="21" fill="#D4D4DA">recover.</text>
