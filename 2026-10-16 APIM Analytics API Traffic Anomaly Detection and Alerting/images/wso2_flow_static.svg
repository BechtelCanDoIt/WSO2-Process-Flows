<text x="381.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Collect Events</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">Every request emits a usage</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">event with status, latency, and</text>
<text x="108.0" y="686" font-size="21" fill="#D4D4DA">consumer.</text>
