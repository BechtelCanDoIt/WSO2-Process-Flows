<text x="1646.5" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OUTPUT</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Log Agent Action</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Write an audit entry separate</text>
