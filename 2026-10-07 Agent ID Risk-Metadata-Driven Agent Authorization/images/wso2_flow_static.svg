<text x="108.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">01</text>
<rect x="341.5" y="500" width="80.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="381.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Agent Presents ID</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">The agent authenticates with</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">mTLS or a private key JWT.</text>
<rect x="503.3333333333333" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="733.3333333333333" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="789.3333333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">IDENTITY</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Load Identity Record</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">Fetch owner, purpose and risk</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">level from the SCIM2 agent</text>
<text x="531.3333333333333" y="686" font-size="21" fill="#D4D4DA">profile.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1167.1666666666665" y="500" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1217.9166666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Read Risk Signals</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Pull live signals such as</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">recent anomalies and calling</text>
<text x="954.6666666666666" y="686" font-size="21" fill="#D4D4DA">context.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1580.0" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1636.0" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">SECURITY</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Evaluate Policy</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">Match metadata and signals</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">against context-aware access</text>
<text x="1378.0" y="686" font-size="21" fill="#D4D4DA">policies.</text>
<rect x="80.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="352.0" y="830" width="70.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="387.0" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">AUTH</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Scope the Token</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Mint a token with least-</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">privilege scopes and</text>
<text x="108.0" y="1016" font-size="21" fill="#D4D4DA">transaction caps.</text>
<rect x="503.3333333333333" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
