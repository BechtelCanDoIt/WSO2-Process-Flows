<rect x="701.8333333333333" y="830" width="143.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="773.5833333333333" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">ORCHESTRATE</text>
<text x="531.3333333333333" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Mark Delegation</text>
<text x="531.3333333333333" y="958" font-size="21" fill="#D4D4DA">Record whether the agent acts</text>
<text x="531.3333333333333" y="987" font-size="21" fill="#D4D4DA">alone or on behalf of a user.</text>
