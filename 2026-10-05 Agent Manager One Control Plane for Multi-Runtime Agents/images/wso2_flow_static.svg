<text x="108.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">01</text>
<rect x="299.5" y="500" width="122.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="360.75" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INTEGRATE</text>
<text x="108.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Register Runtimes</text>
<text x="108.0" y="628" font-size="21" fill="#D4D4DA">Connect Bedrock, LangSmith and</text>
<text x="108.0" y="657" font-size="21" fill="#D4D4DA">custom runtimes as federated</text>
<text x="108.0" y="686" font-size="21" fill="#D4D4DA">sources.</text>
<rect x="503.3333333333333" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="528" font-size="40" font-weight="800" fill="#FF7A1A">02</text>
<rect x="764.8333333333333" y="500" width="80.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="805.0833333333333" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">INPUT</text>
<text x="531.3333333333333" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Discover Agents</text>
<text x="531.3333333333333" y="628" font-size="21" fill="#D4D4DA">Inventory every agent across</text>
<text x="531.3333333333333" y="657" font-size="21" fill="#D4D4DA">runtimes, including the</text>
<text x="531.3333333333333" y="686" font-size="21" fill="#D4D4DA">undocumented ones.</text>
<rect x="926.6666666666666" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="528" font-size="40" font-weight="800" fill="#FF7A1A">03</text>
<rect x="1156.6666666666665" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1212.6666666666665" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">IDENTITY</text>
<text x="954.6666666666666" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Issue Agent Identity</text>
<text x="954.6666666666666" y="628" font-size="21" fill="#D4D4DA">Give each agent a verifiable</text>
<text x="954.6666666666666" y="657" font-size="21" fill="#D4D4DA">identity and a delegation</text>
<text x="954.6666666666666" y="686" font-size="21" fill="#D4D4DA">policy.</text>
<rect x="1350.0" y="470" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="492" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="528" font-size="40" font-weight="800" fill="#FF7A1A">04</text>
<rect x="1580.0" y="500" width="112.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1636.0" y="521" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">SECURITY</text>
<text x="1378.0" y="588" font-size="29" font-weight="700" fill="#FFFFFF">Apply Guardrails</text>
<text x="1378.0" y="628" font-size="21" fill="#D4D4DA">Enforce one guardrail set,</text>
<text x="1378.0" y="657" font-size="21" fill="#D4D4DA">whichever runtime the agent</text>
<text x="1378.0" y="686" font-size="21" fill="#D4D4DA">runs on.</text>
<rect x="80.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="80.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="108.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">05</text>
<rect x="320.5" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="371.25" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">GATEWAY</text>
<text x="108.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Route via Gateway</text>
<text x="108.0" y="958" font-size="21" fill="#D4D4DA">Send LLM and tool traffic</text>
<text x="108.0" y="987" font-size="21" fill="#D4D4DA">through AI Gateway under shared</text>
<text x="108.0" y="1016" font-size="21" fill="#D4D4DA">policy.</text>
<rect x="503.3333333333333" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="503.3333333333333" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="531.3333333333333" y="858" font-size="40" font-weight="800" fill="#FF7A1A">06</text>
<rect x="743.8333333333333" y="830" width="101.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="794.5833333333333" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OBSERVE</text>
<text x="531.3333333333333" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Collect OTel Traces</text>
<text x="531.3333333333333" y="958" font-size="21" fill="#D4D4DA">Stream OpenTelemetry traces</text>
<text x="531.3333333333333" y="987" font-size="21" fill="#D4D4DA">from every runtime into one</text>
<text x="531.3333333333333" y="1016" font-size="21" fill="#D4D4DA">view.</text>
<rect x="926.6666666666666" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="926.6666666666666" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="954.6666666666666" y="858" font-size="40" font-weight="800" fill="#FF7A1A">07</text>
<rect x="1125.1666666666665" y="830" width="143.5" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1196.9166666666665" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">ORCHESTRATE</text>
<text x="954.6666666666666" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Evaluate Behavior</text>
<text x="954.6666666666666" y="958" font-size="21" fill="#D4D4DA">Score agents with built-in and</text>
<text x="954.6666666666666" y="987" font-size="21" fill="#D4D4DA">code-based evaluators.</text>
<rect x="1350.0" y="800" width="370" height="255" rx="18" fill="#26262A" stroke="#3A3A40" stroke-width="1.5"/>
<rect x="1350.0" y="822" width="5" height="44" rx="2.5" fill="#FF7A1A"/>
<text x="1378.0" y="858" font-size="40" font-weight="800" fill="#FF7A1A">08</text>
<rect x="1601.0" y="830" width="91.0" height="30" rx="15" fill="none" stroke="#FF7A1A" stroke-width="1.5"/>
<text x="1646.5" y="851" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF7A1A" text-anchor="middle">OUTPUT</text>
<text x="1378.0" y="918" font-size="29" font-weight="700" fill="#FFFFFF">Suspend or Promote</text>
<text x="1378.0" y="958" font-size="21" fill="#D4D4DA">Operators act on any agent from</text>
<text x="1378.0" y="987" font-size="21" fill="#D4D4DA">a single console.</text>
