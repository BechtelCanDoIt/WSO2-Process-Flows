<text x="80" y="160" font-size="52" font-weight="700" fill="#FFFFFF">One Control Plane for Multi-Runtime Agents</text>
<text x="80" y="204" font-size="24" fill="#A8A8B0">Govern agents where they already run, from a single place.</text>
